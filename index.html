:root{
  --bg:#ecf1ea; --card:#fbfcf9; --soft:#dfe8dd; --field:#f1f5ef;
  --ink:#1c2823; --muted:#56665d; --line:#d2ddd1;
  --verde-t:#17694f; --verde-wash:#d7ebde; --serie:#1f8566;
  --bacca:#a23a66; --bacca-wash:#f7e2eb;
  --on:#fbfcf9; --ombra:0 1px 2px rgba(28,40,35,.12);
  --sans:"Figtree","Segoe UI Variable Text","Segoe UI",system-ui,sans-serif;
  --serif:"Fraunces",Georgia,"Times New Roman",serif;
  --hand:"Caveat","Segoe Print","Bradley Hand",cursive;
  --mono:"Cascadia Mono","Cascadia Code",Consolas,"Courier New",monospace;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#121916; --card:#1b2420; --soft:#26322d; --field:#141c18;
    --ink:#e7eeea; --muted:#9dada4; --line:#2f3d36;
    --verde-t:#84d6b8; --verde-wash:#1e3a30; --serie:#3fa886;
    --bacca:#f29bbd; --bacca-wash:#3d2431;
    --on:#121916; --ombra:0 1px 2px rgba(0,0,0,.4);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#121916; --card:#1b2420; --soft:#26322d; --field:#141c18;
  --ink:#e7eeea; --muted:#9dada4; --line:#2f3d36;
  --verde-t:#84d6b8; --verde-wash:#1e3a30; --serie:#3fa886;
  --bacca:#f29bbd; --bacca-wash:#3d2431;
  --on:#121916; --ombra:0 1px 2px rgba(0,0,0,.4);
  color-scheme:dark;
}

*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 var(--sans)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
h1,h2,p{margin:0}
:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
.neg{color:var(--bacca)}
.muted{color:var(--muted)}

/* Testata */
.top{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:14px 28px;max-width:1040px;margin:0 auto;padding:24px clamp(16px,4vw,32px) 4px}
.marchio{display:inline-flex;align-items:baseline;gap:7px;color:var(--ink);text-decoration:none;white-space:nowrap;border-radius:8px}
.marchio .q{font:700 25px/1 var(--sans);letter-spacing:-.025em}
.marchio em{display:inline-block;font:italic 460 34px/1 "Fraunces Marchio",var(--serif);color:var(--bacca);transform:rotate(-4deg);transform-origin:left bottom}
.top nav{display:flex;gap:2px;padding:4px;border-radius:999px;background:var(--soft)}
.top nav a{padding:8px 16px;border-radius:999px;color:var(--muted);text-decoration:none;font-weight:500;white-space:nowrap}
.top nav a:hover{color:var(--ink)}
.top nav a[aria-current="page"]{background:var(--card);color:var(--ink);font-weight:600;box-shadow:var(--ombra)}
main{max-width:1040px;margin:0 auto;padding:26px clamp(16px,4vw,32px) 90px;outline:0}

.vh{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:10px 20px;margin-bottom:20px}
.vh h1{font:600 clamp(32px,5vw,42px)/1.1 var(--serif);letter-spacing:-.01em}
.vh .sub{color:var(--muted);margin-top:4px}
.avviso{border:1px solid var(--bacca);border-radius:16px;padding:10px 16px;margin-bottom:18px}

/* Pulsanti */
.btn{border:1px solid var(--line);background:var(--card);padding:9px 18px;border-radius:999px;font-weight:600;text-decoration:none;color:var(--ink);display:inline-block}
.btn:hover{border-color:var(--ink)}
.btn.primary{background:var(--ink);border-color:var(--ink);color:var(--on)}
.btn.danger{background:var(--bacca);border-color:var(--bacca);color:var(--on)}
.btn.quiet{border-color:transparent;background:none;color:var(--muted)}
.btn.del{color:var(--bacca)}
.btns{display:flex;flex-wrap:wrap;gap:8px}
.link{border:0;background:none;padding:0;color:var(--muted);text-decoration:underline;text-underline-offset:3px}
.link:hover{color:var(--ink)}

/* Prospetto: valori di partenza */
.base{display:grid;grid-template-columns:1.25fr 1fr 1fr;gap:14px}
.bx{display:flex;flex-direction:column;gap:4px;background:var(--card);border-radius:22px;padding:18px 20px 16px;cursor:text}
.bx:focus-within{outline:2px solid var(--ink);outline-offset:2px}
.bx-p{background:var(--verde-wash)}
.bl{font-weight:600;font-size:15px}
.bi{display:flex;align-items:baseline;gap:6px}
.bi input{flex:0 1 auto;min-width:1ch;max-width:calc(100% - 1.3em);width:6ch;border:0;outline:0;background:none;padding:0;font:650 34px/1.2 var(--sans);letter-spacing:-.02em}
.bi input::placeholder{color:var(--muted);opacity:.55}
.bi i{font-style:normal;font-weight:600;font-size:22px;color:var(--muted)}
.bh{font-size:13px;color:var(--muted)}
input[aria-invalid="true"]{color:var(--bacca)}

/* Prospetto: esito e grafico */
.esito{display:grid;grid-template-columns:minmax(210px,auto) minmax(0,1fr);gap:18px 28px;align-items:center;background:var(--card);border-radius:26px;padding:24px 26px;margin-top:14px}
.esito .lbl{color:var(--muted)}
.hero{font:700 clamp(44px,6vw,58px)/1.08 var(--sans);letter-spacing:-.03em;white-space:nowrap;margin:2px 0 6px}
.delta{font-weight:600}
.delta.su{color:var(--verde-t)} .delta.giu{color:var(--bacca)}
.chart{position:relative;min-width:0}
.chart svg{display:block;width:100%;height:auto;touch-action:pan-y}
.chart text{font:12px var(--sans);fill:var(--muted);font-variant-numeric:tabular-nums}
.chart text.ult{fill:var(--ink);font-weight:600}
.chart .g{stroke:var(--line);stroke-width:1}
.chart .ln{fill:none;stroke:var(--serie);stroke-width:2;stroke-linejoin:round;stroke-linecap:round}
.chart .pt{fill:var(--serie);stroke:var(--card);stroke-width:2}
.chart .ch{stroke:var(--muted);stroke-width:1}
.chart .hp{fill:var(--card);stroke:var(--serie);stroke-width:3}
.tip{position:absolute;left:0;top:0;pointer-events:none;background:var(--ink);color:var(--on);padding:7px 12px;border-radius:12px;font-size:13px;line-height:1.3;white-space:nowrap;z-index:2}
.tip strong{display:block;font-size:16px}

/* Prospetto: mese per mese */
.sez{margin-top:36px}
.sez>h2{font:600 25px/1.2 var(--serif)}
.sez>.sub{color:var(--muted);margin:4px 0 14px;max-width:62ch}
.tw{background:var(--card);border-radius:22px;padding:6px 14px 8px}
.pt{width:100%;border-collapse:collapse}
.pt th,.pt td{padding:9px 10px;text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.pt tbody tr+tr th,.pt tbody tr+tr td{border-top:1px solid var(--line)}
.pt thead th{font-weight:500;font-size:13px;color:var(--muted);padding-top:12px;border-bottom:1px solid var(--line)}
.pt th:first-child{text-align:left}
.pt tbody th{font-weight:500}
.pt td.p{font-weight:700;font-size:17px}
.uw{display:inline-flex;align-items:center;gap:6px}
.eu{position:relative;display:block}
.eu::after{content:"€";position:absolute;right:11px;top:50%;transform:translateY(-50%);color:var(--muted);pointer-events:none}
.eu input{width:100%;text-align:right;padding:8px 28px 8px 10px;border:1px solid var(--line);border-radius:12px;background:var(--field);font-variant-numeric:tabular-nums}
.eu input:hover{border-color:var(--muted)}
.uw .eu{width:124px}
tr.mod .eu input{border-color:var(--bacca);background:var(--bacca-wash)}
.rst{display:inline-grid;place-items:center;width:30px;height:30px;border:0;border-radius:50%;background:none;color:var(--bacca)}
.rst:hover{background:var(--bacca-wash)}
tr:not(.mod) .rst{visibility:hidden}
.sotto{display:flex;justify-content:flex-end;padding:12px 4px 0;min-height:36px}

/* Conti al volo */
.conti{display:grid;grid-template-columns:1fr 1fr;gap:16px;align-items:start}
.lst{background:var(--card);border-radius:22px;padding:20px 20px 16px}
.lst h2{display:flex;align-items:center;gap:9px;font:600 23px/1.2 var(--serif);margin-bottom:14px}
.lst h2::before{content:"";width:11px;height:11px;border-radius:50%;background:var(--bacca)}
.lst-entrate h2::before{background:var(--serie)}
.rg{display:grid;grid-template-columns:minmax(0,1fr) 124px 30px;gap:8px;align-items:center;margin-bottom:8px}
.rg .v{width:100%;min-width:0;padding:8px 12px;border:1px solid var(--line);border-radius:12px;background:var(--field)}
.rg .v:hover{border-color:var(--muted)}
.rg .x{width:30px;height:30px;border:0;border-radius:50%;background:none;color:var(--muted);font-size:20px;line-height:1;padding:0}
.rg .x:hover{background:var(--soft);color:var(--ink)}
.rg:last-child .x{visibility:hidden}
.lt{display:flex;justify-content:space-between;align-items:baseline;gap:12px;border-top:1px solid var(--line);margin-top:14px;padding-top:12px}
.lt strong{font:700 30px/1.2 var(--sans);letter-spacing:-.02em;white-space:nowrap}
.lf{margin-top:6px;min-height:24px;font-size:14px}
.resto{background:var(--soft);border-radius:22px;padding:18px 22px;margin-top:16px}
.resto p+p{margin-top:4px}
.resto strong{font-weight:700;white-space:nowrap}

/* Note: elenco */
.note{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:18px}
.cn{display:flex;flex-direction:column;min-height:236px;padding:24px 24px 18px;border-radius:26px;background:var(--carta);color:var(--inch);font-family:var(--nf);text-decoration:none;transition:transform .16s ease}
.cn:hover{transform:translateY(-3px) rotate(-.5deg)}
.cn h2{font-size:calc(27px*var(--nk));line-height:1.15;font-weight:700;overflow-wrap:anywhere;margin-bottom:10px}
.cn p{font-size:calc(15.5px*var(--nk));line-height:1.45;white-space:pre-wrap;overflow-wrap:anywhere;display:-webkit-box;-webkit-line-clamp:5;-webkit-box-orient:vertical;overflow:hidden;opacity:.86}
.cn p.vu{opacity:.55}
.cn .cd{margin-top:auto;padding-top:14px;font:500 13px var(--sans);opacity:.72}
.vuoto{background:var(--card);border-radius:22px;padding:26px;max-width:54ch}
.vuoto p+p{margin-top:14px}

/* Note: pagina */
.np-top{display:flex;flex-wrap:wrap;align-items:center;gap:8px 14px;margin-bottom:14px}
.np-top .sp{flex:1}
.np-top .muted{font-size:14px}
.np-tools{display:flex;flex-wrap:wrap;align-items:center;gap:12px 24px;background:var(--card);border-radius:22px;padding:12px 18px;margin-bottom:14px}
.tg{display:flex;align-items:center;gap:9px}
.tl{font-size:13px;color:var(--muted)}
.seg{display:inline-flex;gap:2px;padding:3px;border-radius:999px;background:var(--soft)}
.seg button{border:0;background:none;border-radius:999px;padding:5px 13px;line-height:1.4;white-space:nowrap}
.seg button[aria-pressed="true"]{background:var(--card);box-shadow:var(--ombra);font-weight:600}
.sw{display:inline-flex;gap:7px}
.sw button{width:26px;height:26px;padding:0;border-radius:50%;border:1px solid rgba(28,40,35,.22);background:var(--c)}
.sw button[aria-pressed="true"]{outline:2px solid var(--ink);outline-offset:2px}
.foglio{background:var(--carta);color:var(--inch);border-radius:28px;padding:clamp(22px,5vw,50px);min-height:58vh}
.nt{display:block;width:100%;border:0;outline:0;background:none;color:inherit;padding:0;margin-bottom:14px;font:700 calc(34px*var(--nk))/1.15 var(--nf)}
.nx{display:block;width:100%;border:0;outline:0;background:none;color:inherit;padding:0;resize:none;overflow:hidden;min-height:42vh;font:400 var(--ns)/1.6 var(--nf)}
.nt::placeholder,.nx::placeholder{color:var(--inch);opacity:.42}

/* Dati */
.blk{background:var(--card);border-radius:22px;padding:22px 24px;margin-bottom:14px;max-width:72ch}
.blk h2{font:600 22px/1.25 var(--serif);margin-bottom:8px}
.blk p+p,.blk p+.btns,.blk p+.seg{margin-top:12px}

/* Finestre e avvisi */
dialog{border:0;border-radius:22px;padding:0;background:var(--card);color:var(--ink);width:min(440px,calc(100vw - 28px))}
dialog::backdrop{background:rgba(12,18,15,.5)}
.form{display:grid;gap:12px;padding:24px}
.form h2{font:600 23px/1.2 var(--serif)}
.form-foot{display:flex;justify-content:flex-end;gap:8px;margin-top:6px}
#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);display:flex;align-items:center;gap:16px;background:var(--ink);color:var(--on);padding:10px 18px;border-radius:999px;z-index:20;max-width:calc(100vw - 28px)}
#toast[hidden]{display:none}
#toast button{border:0;background:none;color:inherit;font-weight:700;text-decoration:underline;text-underline-offset:3px;padding:0}

@media (max-width:760px){
  .top{justify-content:center;padding-top:20px}
  .top nav{position:fixed;left:10px;right:10px;bottom:10px;z-index:10;box-shadow:0 8px 26px rgba(12,18,15,.22)}
  .top nav a{flex:1;text-align:center;padding:10px 4px;font-size:14px}
  main{padding-bottom:110px}
  #toast{bottom:78px}
  .base{grid-template-columns:1fr 1fr}
  .bx-p{grid-column:1/-1}
  .bx:not(.bx-p) .bi input{font-size:27px}
  .esito{grid-template-columns:minmax(0,1fr);padding:22px 18px}
  .conti{grid-template-columns:minmax(0,1fr)}
  .tw{padding:4px 6px 6px}
  .pt .c-e,.pt .c-r{display:none}
  .pt th,.pt td{padding:9px 6px}
  .uw .eu{width:104px}
  .rg{grid-template-columns:minmax(0,1fr) 108px 30px}
  .np-top{justify-content:space-between}
  .np-top .sp{display:none}
  .np-top .muted{order:3;flex-basis:100%}
  .np-tools{gap:12px 18px;padding:14px 16px}
  .tg{flex-direction:column;align-items:flex-start;gap:5px}
  .seg{flex-wrap:wrap;border-radius:20px}
}
@media (prefers-reduced-motion:reduce){.cn{transition:none}.cn:hover{transform:none}}

/* ===== Temi: chiaro e Bosco stanno in cima al foglio; qui i due scuri nuovi e i colori dei grafici ===== */
:root{--pri:var(--ink);--su-pri:var(--on);--giallo:#f5d849;
  --c0:#2a78d6;--c1:#eb6834;--c2:#1baf7a;--c3:#eda100;--c4:#e87ba4;--c5:#008300;--c6:#4a3aa7;--c7:#e34948;--cx:#9aa39d}
@media (prefers-color-scheme:dark){:root:not([data-theme]){--c0:#3987e5;--c1:#d95926;--c2:#199e70;--c3:#c98500;--c4:#d55181;--c5:#008300;--c6:#9085e9;--c7:#e66767;--cx:#6f7a74}}
:root[data-theme="dark"],:root[data-theme="blu"],:root[data-theme="carbone"]{--c0:#3987e5;--c1:#d95926;--c2:#199e70;--c3:#c98500;--c4:#d55181;--c5:#008300;--c6:#9085e9;--c7:#e66767;--cx:#6f7a74}
:root[data-theme="blu"]{
  --bg:#0a1122; --card:#111b30; --soft:#1b2946; --field:#0c1528;
  --ink:#e8ecf6; --muted:#94a2bd; --line:#27365a;
  --verde-t:#8fd9c0; --verde-wash:#16294c; --serie:#5b8fe8;
  --bacca:#f2a3bb; --bacca-wash:#3a2340;
  --on:#0a1122; --ombra:0 1px 2px rgba(0,0,0,.5);
  color-scheme:dark;
}
:root[data-theme="carbone"]{
  --bg:#111112; --card:#1b1b1c; --soft:#29292b; --field:#141415;
  --ink:#f1f0ea; --muted:#a5a49c; --line:#353534;
  --verde-t:#98d7a8; --verde-wash:#2b2817; --serie:#c98500;
  --bacca:#ff9f8f; --bacca-wash:#3b211d;
  --on:#111112; --ombra:0 1px 2px rgba(0,0,0,.5);
  --pri:#f5d849; --su-pri:#111112;
  color-scheme:dark;
}
.btn.primary{background:var(--pri);border-color:var(--pri);color:var(--su-pri)}

/* titolo: "morbido" giallo; sul tema chiaro ha un contorno scuro, altrimenti non si leggerebbe */
.marchio em{color:var(--giallo)}
:root:not([data-theme]) .marchio em,:root[data-theme="light"] .marchio em{-webkit-text-stroke:3px var(--ink);paint-order:stroke fill}
@media (prefers-color-scheme:dark){:root:not([data-theme]) .marchio em{-webkit-text-stroke:0}}

/* testata */
.top nav a.ing{display:inline-grid;place-items:center;padding:8px 12px}
.top nav a svg{display:block}
.top nav a .ic{display:inline-block;vertical-align:-2px;margin-right:5px}
.stato{flex:0 0 100%;order:3;border:0;background:none;padding:0 6px;margin-top:-6px;text-align:right;font-size:13px;color:var(--muted);border-radius:6px}
.stato::before{content:"";display:inline-block;width:7px;height:7px;border-radius:50%;margin-right:7px;vertical-align:1px;background:var(--line)}
.stato.ok::before{background:var(--serie)}
.stato.vivo::before{background:var(--c0)}
.stato.attesa::before{background:var(--bacca)}
.stato.attesa{color:var(--ink)}
.stato:hover{color:var(--ink)}
body.largo .top,body.largo main{max-width:1280px}

.btn.sm{padding:5px 13px;font-size:14px}
.btn:disabled,.seg button:disabled{opacity:.5;cursor:default}
.btn:disabled:hover{border-color:var(--line)}
.aiuto{color:var(--muted);font-size:14px;max-width:82ch;margin-top:16px}
.aiuto strong{color:var(--ink);font-weight:600}
.aiuto a{color:var(--ink)}
.pic{font-size:13px}
.num{font-variant-numeric:tabular-nums;white-space:nowrap}
code{font:13px var(--mono);background:var(--soft);padding:2px 6px;border-radius:6px;overflow-wrap:anywhere}
.tsc{overflow-x:auto}
.al{list-style:none;margin:0;padding:0}
.al li{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:9px 0}
.al li+li{border-top:1px solid var(--line)}
.al a{color:var(--ink);overflow-wrap:anywhere}
.al .x,.it .x{flex:none;width:30px;height:30px;border:0;border-radius:50%;background:none;color:var(--muted);font-size:20px;line-height:1;padding:0}
.al .x:hover,.it .x:hover{background:var(--soft);color:var(--ink)}
#dlg .form a{color:var(--ink)}

/* testo con elenchi e grassetto (note e pagina Dati) */
.rt{white-space:pre-wrap;overflow-wrap:anywhere;cursor:text}
.rt:focus{outline:0}
.rt.vuoto::before{content:attr(data-ph);float:left;height:0;color:var(--inch);opacity:.42;pointer-events:none}
.rt ul,.rt ol{margin:.25em 0;padding-left:1.35em}
.rt li{margin:.1em 0}
.rt b{font-weight:700}
.np-tools .seg b{font-weight:800}
.fc{--carta:var(--card);--inch:var(--ink);--nf:var(--sans);--ns:16.5px;--nk:1;min-height:62vh}

/* conti al volo: un elenco solo, e i prossimi 6 mesi */
.conti{grid-template-columns:minmax(0,1.3fr) minmax(0,1fr)}
.lst h2::before{display:none}
.rg{grid-template-columns:34px minmax(0,1fr) 108px 124px 30px}
.sg{width:34px;height:34px;padding:0;border-radius:50%;border:1px solid var(--line);font:700 19px/1 var(--sans)}
.sg.meno{color:var(--bacca);border-color:var(--bacca);background:var(--bacca-wash)}
.sg.piu{color:var(--verde-t);border-color:var(--verde-t);background:var(--verde-wash)}
.rg select{width:100%;min-width:0;padding:8px 6px;border:1px solid var(--line);border-radius:12px;background:var(--field)}
.rg select:hover{border-color:var(--muted)}
.lf{display:flex;justify-content:space-between;align-items:baseline;gap:12px}
.lst .resto{margin-top:12px;padding:13px 16px;border-radius:16px}
.m6{padding:11px 0}
.m6+.m6{border-top:1px solid var(--line)}
.m6 h3{font:600 15px/1.4 var(--sans);margin:0 0 3px}
.m6 ul{list-style:none;margin:0;padding:0}
.m6 li,.m6t{display:flex;justify-content:space-between;gap:14px}
.m6 li span:first-child{min-width:0;overflow-wrap:anywhere}
.m6 .su{color:var(--verde-t)}
.m6t{font-weight:600;margin-top:3px}
.m6.niente h3{font-weight:500;color:var(--muted)}
.m6.niente p{font-size:14px}

/* ReesparmioFoil */
.pf{background:var(--card);border-radius:24px;padding:22px 22px 14px;margin-top:14px}
.pf-h{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:baseline;gap:8px 16px;margin-bottom:12px}
.pf-h h2{font:600 26px/1.2 var(--serif)}
.pf-top{display:grid;grid-template-columns:minmax(0,1fr) 168px minmax(190px,300px);gap:18px 30px;align-items:center;margin-bottom:18px}
.pf-val .lbl{color:var(--muted)}
.pf-val .pic{margin-top:6px}
.pf-vuoto{color:var(--muted);max-width:72ch}
.torta{position:relative;width:168px}
.torta svg{display:block;width:100%;height:auto}
.torta path{stroke:var(--card);stroke-width:2;stroke-linejoin:round}
.torta .c0{fill:var(--c0)} .torta .c1{fill:var(--c1)} .torta .c2{fill:var(--c2)} .torta .c3{fill:var(--c3)} .torta .c4{fill:var(--c4)} .torta .c5{fill:var(--c5)} .torta .c6{fill:var(--c6)} .torta .c7{fill:var(--c7)} .torta .cx{fill:var(--cx)}
i.c0{background:var(--c0)} i.c1{background:var(--c1)} i.c2{background:var(--c2)} i.c3{background:var(--c3)} i.c4{background:var(--c4)} i.c5{background:var(--c5)} i.c6{background:var(--c6)} i.c7{background:var(--c7)} i.cx{background:var(--cx)}
.leg{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:minmax(0,1fr);gap:5px;min-width:0;font-size:14px}
.leg li{display:flex;align-items:baseline;gap:8px}
.leg i{flex:none;width:10px;height:10px;border-radius:50%}
.leg span{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.leg strong{font-weight:600;font-variant-numeric:tabular-nums;white-space:nowrap}
.it{width:100%;min-width:940px;border-collapse:collapse;font-variant-numeric:tabular-nums}
.it th,.it td{padding:10px 8px;text-align:right;white-space:nowrap;border-top:1px solid var(--line)}
.it thead th{padding-top:2px;border-top:0;font-weight:500;font-size:13px;color:var(--muted)}
.it th:first-child{text-align:left;padding-left:2px}
.it tbody th{min-width:180px;font-weight:600;white-space:normal}
.it tbody th i{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:8px}
.it .tk{display:block;margin-left:18px;font-weight:400;font-size:12.5px;color:var(--muted)}
.it tr.mancante .tk{color:var(--bacca)}
.it td.su{color:var(--verde-t)} .it td.giu{color:var(--bacca)} .it td.vuota{color:var(--muted)}
.it td.gu small{display:block;font-size:12.5px}
.it tfoot th,.it tfoot td{border-top:1px solid var(--ink);font-weight:700}
.it td.man .eu{display:inline-block;width:104px}
.it td:last-child{width:34px;padding:0 0 0 4px}
.it.st{min-width:580px}
.it.st .sx{text-align:left;color:var(--muted)}
.it.st tbody th{min-width:150px}
.pf-az{display:flex;flex-wrap:wrap;align-items:center;gap:12px;margin-top:16px}
.pf-az .seg button[aria-pressed="true"]{background:var(--card)}
.fin{display:flex;flex-wrap:wrap;align-items:flex-end;gap:10px 12px;margin-top:12px;padding:14px 16px;border-radius:18px;background:var(--field)}
.fin label{display:grid;gap:4px;flex:1 1 140px;min-width:0}
.fin label.lungo{flex:2 1 230px}
.fin label.corto{flex:1 1 110px}
.fin label>span:first-child{font-size:13px;color:var(--muted)}
.fin input,.fin select{width:100%;min-width:0;padding:8px 10px;border:1px solid var(--line);border-radius:12px;background:var(--card)}
.fin .eu input{padding-right:28px}
.fin .err{flex-basis:100%;margin:0;color:var(--bacca);font-size:14px}
.nuovo-pf{margin-top:14px;background:none;border:1px dashed var(--line)}
.storico{margin-top:16px;padding-top:10px;border-top:1px solid var(--line)}
.storico summary{cursor:pointer;padding:4px 0;font-weight:600}
.storico>div{margin-top:6px}

/* ferie */
.vh-t{display:flex;flex-wrap:wrap;align-items:center;gap:10px 18px}
.msw{display:inline-flex;align-items:center;gap:6px}
.msw button{min-width:36px;height:36px;padding:0 12px;border:1px solid var(--line);border-radius:999px;background:var(--card)}
.msw button:hover{border-color:var(--ink)}
.msw .per{min-width:3.4em;text-align:center;font:600 22px/1 var(--serif)}
.tw.tsc{padding:16px 16px 12px}
.ft{width:100%;min-width:900px;border-collapse:collapse;font-variant-numeric:tabular-nums}
.ft th,.ft td{padding:7px 3px;text-align:center}
.ft thead th{padding-bottom:9px;border-bottom:1px solid var(--line);font-weight:500;font-size:12.5px;letter-spacing:.03em;color:var(--muted)}
.ft thead th:first-child{text-align:left;font:600 20px/1 var(--serif);letter-spacing:0;color:var(--ink)}
.ft thead th.ora{color:var(--ink);font-weight:700}
.ft tbody tr+tr th,.ft tbody tr+tr td{border-top:1px solid var(--line)}
.ft tbody th{padding-right:12px;text-align:left;font-weight:600;white-space:nowrap}
.ft tbody th small{display:block;font-weight:400;font-size:12px;color:var(--muted)}
.ft input{width:100%;min-width:42px;padding:7px 2px;border:1px solid var(--line);border-radius:10px;background:var(--field);text-align:center}
.ft input:hover{border-color:var(--muted)}
.ft td.ora input{border-color:var(--muted)}
.ft .fd{min-width:66px;border-color:transparent;background:var(--verde-wash);font-weight:700}
.ft .rim{min-width:76px;font-weight:700;font-size:17px;white-space:nowrap}
.ft .rim.neg{color:var(--bacca)}
.ft .rim.solo{font-weight:500;font-size:13px;color:var(--muted)}
.festivi{max-width:92ch;margin-top:26px;font-size:14px;line-height:1.65;color:var(--muted)}
.festivi h2{margin-bottom:4px;font:600 19px/1.3 var(--serif);color:var(--ink)}
.festivi p{margin-top:5px}
.festivi b{font-weight:600;color:var(--ink)}
.festivi .et{margin-right:3px;font-weight:700;color:var(--ink)}
.festivi .et::after{content:":"}
.festivi span{white-space:nowrap}
.festivi .nota{font-size:13px}

/* scheda cifrata: PIN */
.pinbox{display:grid;justify-items:center;gap:10px;max-width:400px;margin:28px auto 0;background:var(--card);border-radius:26px;padding:30px 26px 24px;text-align:center}
.luc{color:var(--bacca);margin-bottom:2px}
.pinl{font-weight:600}
.pin::placeholder{color:var(--muted);opacity:.45}
.pin{width:100%;max-width:250px;padding:10px 8px 10px 20px;border:1px solid var(--line);border-radius:14px;background:var(--field);font:700 30px/1.2 var(--sans);letter-spacing:.42em;text-align:center;-webkit-text-security:disc}
.pin:hover{border-color:var(--muted)}
.pin:disabled{opacity:.6}
.pinmsg{min-height:1.5em;color:var(--bacca);font-weight:500}
.pinnota{font-size:13px;color:var(--muted);margin-top:6px}

/* impostazioni */
.blk a{color:var(--ink)}
.blk .muted{font-size:14px}
.blk p+.guida,.blk .guida+form,.blk .btns+.guida,.blk .btns+p,.blk .guida+p,.blk p+.temi{margin-top:12px}
.guida{border:1px solid var(--line);border-radius:14px;padding:10px 16px}
.guida summary{cursor:pointer;font-weight:600}
.guida ol{margin:12px 0 10px;padding-left:22px;display:grid;gap:8px}
.riga{display:flex;flex-wrap:wrap;gap:8px}
.riga input{flex:1 1 280px;min-width:0;padding:9px 12px;border:1px solid var(--line);border-radius:12px;background:var(--field)}
.temi{display:flex;flex-wrap:wrap;gap:8px}
.temi button{display:inline-flex;align-items:center;gap:8px;padding:7px 15px 7px 9px;border:1px solid var(--line);border-radius:999px;background:var(--card)}
.temi button:hover{border-color:var(--muted)}
.temi button[aria-pressed="true"]{border-color:var(--ink);font-weight:600}
.temi i{width:20px;height:20px;border-radius:50%;border:1px solid var(--muted)}
.temi i.meta{background:linear-gradient(90deg,#ecf1ea 50%,#1b2420 50%)}

@media (max-width:900px){
  .pf-top{grid-template-columns:150px minmax(0,1fr)}
  .pf-top .pf-val{grid-column:1/-1}
  .torta{width:150px}
}
@media (max-width:760px){
  .top nav{overflow-x:auto;scrollbar-width:none}
  .top nav::-webkit-scrollbar{display:none}
  .top nav a{flex:1 0 auto;padding:10px 3px;font-size:12px}
  .top nav a.ing{flex:0 0 34px;padding:10px 0}
  .top nav .lg{display:none}
  .top nav a .ic{margin-right:3px}
  .stato{text-align:center;margin-top:0}
  .conti{grid-template-columns:minmax(0,1fr)}
  .rg{grid-template-columns:32px minmax(0,1fr) 92px 28px;gap:6px}
  .rg .sg{grid-area:1/1} .rg .v{grid-area:1/2} .rg .eu{grid-area:1/3} .rg .x{grid-area:1/4}
  .rg select{grid-area:2/2/3/4}
  .rg{margin-bottom:12px}
  .sg{width:32px;height:32px}
  .pf{padding:18px 14px 10px}
  .fc{min-height:56vh}
}

</style>
</head>

<script>
(() => {
'use strict';
/* ---------- Testo con elenchi e grassetto ----------
   Note e pagina Dati salvano un HTML ridottissimo: grassetto, corsivo, elenchi, a capo. Tutto il resto
   (attributi, stili, script, immagini) viene tolto ogni volta che un testo entra o esce dall'editor. */
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const TAG_OK = { B: 1, I: 1, U: 1, UL: 1, OL: 1, LI: 1, BR: 1, DIV: 1, P: 1 };
const TAG_VIA = /^(SCRIPT|STYLE|IFRAME|OBJECT|EMBED|TEMPLATE|NOSCRIPT|SVG|MATH|HEAD|TITLE|META|LINK|BASE)$/;
function pulisciHtml(html, max) {
  const t = document.createElement('template');
  t.innerHTML = String(html == null ? '' : html).slice(0, max || 400000);
  const out = document.createElement('div');
  (function copiaNodi(src, dst, liv) {
    for (const n of src.childNodes) {
      if (n.nodeType === 3) dst.appendChild(document.createTextNode(n.nodeValue));
      else if (n.nodeType === 1) {
        let tag = n.tagName.toUpperCase();
        if (tag === 'STRONG') tag = 'B'; else if (tag === 'EM') tag = 'I';
        if (TAG_VIA.test(tag)) continue;
        if (TAG_OK[tag] && liv < 10) { const el = document.createElement(tag); dst.appendChild(el); if (tag !== 'BR') copiaNodi(n, el, liv + 1); }
        else copiaNodi(n, dst, liv);
      }
    }
  })(t.content, out, 0);
  return out.innerHTML;
}
function htmlDaTesto(txt, markdown) {                       // testo semplice (o un file .md) → HTML dell'editor
  const righe = String(txt || '').replace(/\r\n?/g, '\n').split('\n');
  const dentro = r => (markdown ? esc(r).replace(/\*\*(.+?)\*\*/g, '<b>$1</b>') : esc(r));
  let h = '', lista = false;
  for (const r of righe) {
    const m = markdown && r.match(/^\s*[-*•]\s+(.*)$/);
    if (m) { if (!lista) { h += '<ul>'; lista = true; } h += `<li>${dentro(m[1])}</li>`; continue; }
    if (lista) { h += '</ul>'; lista = false; }
    h += `<div>${r.trim() === '' ? '<br>' : dentro(r)}</div>`;
  }
  h += lista ? '</ul>' : '';
  return h === '<div><br></div>' ? '' : h;
}
function testoDaHtml(html) {                                // per anteprime e controlli "è vuoto?"
  const t = document.createElement('template'); t.innerHTML = html || '';
  let s = '';
  (function visita(n) {
    for (const c of n.childNodes) {
      if (c.nodeType === 3) s += c.nodeValue;
      else if (c.nodeType === 1) {
        if (c.tagName === 'BR') { s += '\n'; continue; }
        const blocco = /^(DIV|P|LI|UL|OL)$/.test(c.tagName);
        if (blocco && s && !s.endsWith('\n')) s += '\n';
        if (c.tagName === 'LI') s += '• ';
        visita(c);
        if (/^(DIV|P|LI|UL|OL)$/.test(c.tagName) && !s.endsWith('\n')) s += '\n';
      }
    }
  })(t.content);
  return s.replace(/\n{3,}/g, '\n\n').trim();
}
function rtVuoto(el) { if (el) el.classList.toggle('vuoto', !el.textContent.trim() && !el.querySelector('li')); }
const barraTesto = () => `<div class="seg"><button type="button" data-rt="bold" title="Grassetto (Ctrl+B)" aria-label="Grassetto"><b>G</b></button><button type="button" data-rt="insertUnorderedList" title="Elenco puntato: anche con trattino e spazio a inizio riga">Elenco</button></div>`;
function rtPrimaDelCursore(el) {                             // il testo tra l'inizio della riga e il cursore
  const s = getSelection();
  if (!s.rangeCount || !s.isCollapsed || !el.contains(s.anchorNode)) return null;
  let blocco = s.anchorNode;
  while (blocco !== el && !(blocco.nodeType === 1 && /^(DIV|P|LI)$/.test(blocco.tagName))) blocco = blocco.parentNode;
  const r = document.createRange();
  r.setStart(blocco, 0); r.setEnd(s.anchorNode, s.anchorOffset);

}
document.addEventListener('keydown', e => {

  const c = rtPrimaDelCursore(el);

  const svg = box.firstChild, ch = svg.querySelector('.ch'), hp = svg.querySelector('.hp'), tip = box.lastChild;
  const mostra = e => {

function aggiornaConti() {

function rigaDi(el) {

/* ---------- Copia su file ---------- */
function etaBackup() {
  if (!db.ultimoBackup) return 'mai fatta';
  const g = Math.floor((Date.now() - new Date(db.ultimoBackup).getTime()) / 864e5);
  return g <= 0 ? 'oggi' : g === 1 ? 'ieri' : `${g} giorni fa`;
}
function scarica(nome, testo, tipo) {
  const url = URL.createObjectURL(new Blob([testo], { type: tipo }));
  const a = document.createElement('a'); a.href = url; a.download = nome;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 2000);
}
function esportaBackup() {
  db.ultimoBackup = new Date().toISOString(); salva();
  scarica(`quaderno-morbido-${oggi()}.json`, JSON.stringify(Object.assign({ app: 'quaderno-morbido' }, copia()), null, 2), 'application/json');

function importaBackup(file) {
  const r = new FileReader();

    let o;

    if (!o || o.app !== 'quaderno-morbido' || !o.base || !Array.isArray(o.note)) return avviso('Il file non è una copia di Quaderno morbido.');
    const n = normalizza(o);
    if (!await chiedi('Ripristinare da questa copia?', `Il file contiene un patrimonio di ${eur(n.base.patrimonio, n.base.patrimonio % 100 ? 2 : 0)} e ${plur(n.note.length, 'nota', 'note')}. Prenderà il posto di quello che c'è adesso.`, 'Ripristina', false)) return;
    n.tema = db.tema; cassaforteBlocca(); db = n; salva(); disegna(); avviso('Copia ripristinata');
  };

/* ---------- Disegno ---------- */
function disegna() {
  const r = rotta();
  if (aperta && !(r.vista === 'nota' && r.id === aperta)) {                 // una nota lasciata vuota non resta in giro
    const i = db.note.findIndex(n => n.id === aperta);
    if (i >= 0 && notaVuota(db.note[i])) { db.note.splice(i, 1); salva(); }
    aperta = null;
  }
  const voce = r.vista === 'nota' ? 'note' : r.vista;
  document.querySelectorAll('.top nav a').forEach(a => { if (a.dataset.v === voce) a.setAttribute('aria-current', 'page'); else a.removeAttribute('aria-current'); });
  if (osservatore) { osservatore.disconnect(); osservatore = null; }
  if (r.vista !== 'dati') cassaforteBlocca();
  if (r.vista !== 'reesparmiofoil') invFerma();
  document.body.classList.toggle('largo', r.vista === 'reesparmiofoil');
  const viste = { prospetto: vProspetto, conti: vConti, reesparmiofoil: vInvestimenti, note: vNote, dati: vCassaforte, ferie: vFerie, impostazioni: vImpostazioni };
  main.innerHTML = r.vista === 'nota' ? vNota(r.id) : viste[r.vista]();

      osservatore.observe($('#chart'));

  } else if (r.vista === 'conti') aggiornaConti();
  else if (r.vista === 'nota') { aperta = r.id; rtVuoto($('#nx')); if (notaVuota(notaAperta())) $('#nt').focus(); }
  else if (r.vista === 'reesparmiofoil') dopoInvestimenti();
  else if (r.vista === 'ferie') aggiornaFerie();
  else if (r.vista === 'dati') dopoCassaforte();
  else if (r.vista === 'impostazioni') dopoImpostazioni();

const azioni = {
  'reset-mese': b => {
    delete db.mesi[b.dataset.ym]; salva();
    const inp = main.querySelector(`input[data-mese="${b.dataset.ym}"]`);
    inp.value = campo(db.base.spese); inp.removeAttribute('aria-invalid'); aggiornaProspetto(false); inp.focus();
  },
  'reset-tutti': () => {
    const prima = Object.assign({}, db.mesi);

  },
  'via-riga': b => {
    const i = db.conti.voci.findIndex(x => x.id === b.closest('.rg').dataset.id);
    if (i < 0) return;
    const [tolta] = db.conti.voci.splice(i, 1);

  },
  'svuota-lista': () => {

  },
  segno: b => {
    const { r } = rigaDi(b), [t, c, aiuto] = segnoTesto(Object.assign(r, { segno: r.segno > 0 ? -1 : 1 }));
    b.textContent = t; b.className = 'sg ' + c; b.title = aiuto; b.setAttribute('aria-label', aiuto);
    salva(); aggiornaConti();
  },
  'nuova-nota': () => {
    const n = { id: uid(), titolo: '', testo: '', font: 'semplice', dim: 'medio', carta: GIRO[db.note.length % GIRO.length], inch: 'nero', aggiornata: Date.now(), allegati: [], ricco: true };
    db.note.push(n); salva(); location.hash = '#nota/' + n.id;
  },
  'canc-nota': () => {
    const i = db.note.findIndex(n => n.id === aperta); if (i < 0) return;
    const [n] = db.note.splice(i, 1), vuota = notaVuota(n);
    aperta = null; salva(); location.hash = '#note';

  },
  'n-font': b => stile('font', b), 'n-dim': b => stile('dim', b), 'n-carta': b => stile('carta', b), 'n-inch': b => stile('inch', b),
  annulla: () => { const fn = annulla; annulla = null; $('#toast').hidden = true; if (fn) fn(); },
  esporta: esportaBackup,
  importa: () => $('#imp').click(),
  tema: b => { db.tema = b.dataset.v; salva(); applicaTema(); disegna(); },
  svuota: async () => {
    if (!await chiedi('Svuotare il quaderno?', `Prospetto, conti al volo e ReesparmioFoil tornano a zero; ${db.note.length === 1 ? 'la nota' : `le ${db.note.length} note`} e la scheda cifrata vengono eliminate${driveAttivo() ? ', anche su Drive' : ''}. I backup già fatti restano.`, 'Svuota il quaderno', true)) return;
    const tema = db.tema; cassaforteBlocca(); db = vuoto(); db.tema = tema; aperta = null; salva(); disegna(); avviso('Quaderno svuotato');
  }
};
const numerico = t => t.matches && t.matches('[data-base],[data-mese],[data-f="importo"]');
document.addEventListener('click', e => {
  const b = e.target.closest('[data-act]');
  if (b && azioni[b.dataset.act]) azioni[b.dataset.act](b);
});
document.addEventListener('input', e => {

});

document.addEventListener('keydown', e => {

/* ---------- Google Drive: file e cartelle ---------- */

const corpoDati = () => JSON.stringify(Object.assign({ app: 'quaderno-morbido' }, copia()));

async function creaRemoto() {
  const n = modN, m = multiparte({ name: FILE_DATI, parents: [dr.cartella], mimeType: 'application/json' }, corpoDati(), 'application/json');
  const j = await gj(`${UP}/files?uploadType=multipart&fields=id,md5Checksum`, { method: 'POST', headers: { 'Content-Type': m.tipo }, body: m.blob });
  dr.file = j.id; dr.rev = j.md5Checksum; dr.salvato = Date.now(); dr.sporco = modN !== n; salvaDr();

  const n = modN;

  dr.rev = j.md5Checksum; dr.salvato = Date.now(); dr.sporco = modN !== n; salvaDr();

  cassaforteBlocca();

      else if (await chiedi('Due versioni diverse', `Su Drive c'è una versione salvata da un altro dispositivo il ${new Date(m.modifiedTime).toLocaleString('it-IT', { day: 'numeric', month: 'long', hour: '2-digit', minute: '2-digit' })}. Qui ci sono modifiche che non sono ancora salite. Quale tengo?`, 'Quella di questo dispositivo', false, 'Quella di Drive')) await caricaRemoto(true);

const periodo = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}`;

/* ---------- ReesparmioFoil ----------
   Ogni portafoglio ha gli strumenti (nome, ISIN o ticker) e lo storico dei movimenti (quote, prezzo, data).
   Quote, prezzo medio di carico e capitale investito si ricavano dai movimenti: lo strumento, una volta
   inserito, non si modifica; si aggiungono movimenti. */
const nfD = (min, max) => new Intl.NumberFormat('it-IT', { minimumFractionDigits: min, maximumFractionDigits: max, useGrouping: 'always' });

const meno = s => s.replace('-', '−');
const euro = v => meno(NF2.format(v)) + ' €';
const euroSegno = v => (v > 0.004 ? '+ ' : v < -0.004 ? '− ' : '') + NF2.format(Math.abs(v)) + ' €';
const percSegno = v => (v > 0.04 ? '+' : v < -0.04 ? '−' : '') + NF1.format(Math.abs(v)) + ' %';
const classeSegno = v => (v > 0.004 ? 'su' : v < -0.004 ? 'giu' : '');
const NOME_FOGLIO = 'Prezzi (Quaderno morbido)';
const invForm = {}, invStorico = {};
let invTimer = 0, invOccupato = false, invMsg = '', tPrezzi = 0;
function leggiDec(v) {
  let s = String(v).replace(/[€\s ]/g, '');
  if (!s) return 0;
  if (s.includes(',')) s = s.replace(/\./g, '').replace(',', '.');
  else if (/^\d{1,3}(\.\d{3})+$/.test(s)) s = s.replace(/\./g, '');
  if (!/^\d+(\.\d{1,6})?$/.test(s)) return null;
  const n = parseFloat(s);
  return n < 1e12 ? n : null;
}
const pfDi = id => db.inv.portafogli.find(p => p.id === id);
const pfDa = el => pfDi(el.closest('.pf').dataset.pf);
const tickerUsati = () => [...new Set(db.inv.portafogli.flatMap(p => p.strumenti).map(s => s.ticker).filter(Boolean))].slice(0, 200);
function contiPf(pf) {
  const l = pf.strumenti.map(s => {
    let qta = 0, investiti = 0;
    for (const m of pf.movimenti) if (m.s === s.id) { qta += m.q; investiti += m.q * m.p; }
    const z = s.ticker ? db.inv.prezzi[s.ticker] : null, vivo = !!(z && !z.err && z.eur > 0);
    const prezzo = vivo ? z.eur : (s.manuale || null);
    return { s, qta, investiti, carico: qta ? investiti / qta : 0, z: vivo ? z : null, nonTrovato: !!(z && z.err), prezzo,
      valore: prezzo != null ? qta * prezzo : investiti,       // senza prezzo, lo conto per quanto è costato
      guadagno: prezzo != null ? qta * prezzo - investiti : null };
  });
  const valore = l.reduce((a, r) => a + r.valore, 0);
  l.forEach(r => { r.alloc = valore > 0 ? r.valore / valore * 100 : 0; });
  const conPrezzo = l.filter(r => r.guadagno != null);
  return { l, valore, investiti: l.reduce((a, r) => a + r.investiti, 0), guadagno: conPrezzo.reduce((a, r) => a + r.guadagno, 0), base: conPrezzo.reduce((a, r) => a + r.investiti, 0), senzaPrezzo: l.length - conPrezzo.length };
}

/* torta dell'allocazione: otto colori fissi per strumento; oltre l'ottavo, i più piccoli confluiscono in "Altri" */
function fette(l) {
  let con = l.filter(r => r.valore > 0).map(r => ({ nome: r.s.nome, cls: 'c' + (r.s.col % 8), valore: r.valore, alloc: r.alloc }));
  if (con.length > 8) {
    con.sort((a, b) => b.valore - a.valore);
    const resto = con.slice(7);
    con = con.slice(0, 7).concat([{ nome: `Altri ${resto.length}`, cls: 'cx', valore: resto.reduce((a, r) => a + r.valore, 0), alloc: resto.reduce((a, r) => a + r.alloc, 0) }]);
  }
  return con;
}
function tortaHtml(l) {
  const f = fette(l); if (!f.length) return '';
  const C = 100, R = 94, r = 57, tot = f.reduce((a, x) => a + x.valore, 0), pt = (rag, ang) => `${(C + rag * Math.cos(ang)).toFixed(2)} ${(C + rag * Math.sin(ang)).toFixed(2)}`;
  let a0 = -Math.PI / 2, archi = '';
  f.forEach((x, i) => {
    const giro = x.valore / tot * Math.PI * 2, a1 = a0 + giro, dati = `class="${x.cls}" data-n="${esc(x.nome)}" data-v="${esc(euro(x.valore))}" data-p="${esc(NF1.format(x.alloc))} %"`;
    if (f.length === 1) archi += `<path ${dati} fill-rule="evenodd" d="M${C - R} ${C}a${R} ${R} 0 1 0 ${2 * R} 0a${R} ${R} 0 1 0 ${-2 * R} 0ZM${C - r} ${C}a${r} ${r} 0 1 0 ${2 * r} 0a${r} ${r} 0 1 0 ${-2 * r} 0Z"/>`;
    else { const g = giro > Math.PI ? 1 : 0; archi += `<path ${dati} d="M${pt(R, a0)}A${R} ${R} 0 ${g} 1 ${pt(R, a1)}L${pt(r, a1)}A${r} ${r} 0 ${g} 0 ${pt(r, a0)}Z"/>`; }
    a0 = a1;
  });
  return `<div class="torta"><svg viewBox="0 0 200 200" role="img" aria-label="Allocazione: ${esc(f.map(x => `${x.nome} ${NF1.format(x.alloc)} %`).join(', '))}">${archi}</svg><div class="tip" hidden><strong></strong><span></span></div></div>
    <ul class="leg">${f.map(x => `<li><i class="${x.cls}"></i><span>${esc(x.nome)}</span><strong>${NF1.format(x.alloc)} %</strong></li>`).join('')}</ul>`;
}
const cellaPerc = v => (v == null ? '<td class="vuota">–</td>' : `<td class="${classeSegno(v)}">${percSegno(v)}</td>`);
function boxPf(pf) {

  const x = Math.max(0, Math.min(r.width - tip.offsetWidth, e.clientX - r.left - tip.offsetWidth / 2)), y = e.clientY - r.top - tip.offsetHeight - 12;

/* ---------- Ferie ----------
   Per ogni anno solare: quattro righe (ferie, ex festività, banca ore, malattia), una cella "Disponibili" e dodici
   mesi. Quello che scrivi nei mesi viene tolto dai disponibili. Sotto, i festivi dell'anno calcolati per Roma. */
const NFF = nfD(0, 2);
let annoFerie = new Date().getFullYear();
const rigaFerie = (anno, k) => (db.ferie[anno] && db.ferie[anno][k]) || { d: null, m: [] };
function rigaFerieScrivi(anno, k) {
  const a = db.ferie[anno] || (db.ferie[anno] = {});
  return a[k] || (a[k] = { d: null, m: Array(12).fill(0) });
}
const numFerie = v => (v ? NFF.format(v) : '');

/* festivi: nazionali, più il patrono di Roma; ponte = il giorno lavorativo tra un festivo e il fine settimana */
function pasqua(y) {
  const a = y % 19, b = Math.floor(y / 100), c = y % 100, d = Math.floor(b / 4), e = b % 4, f = Math.floor((b + 8) / 25), g = Math.floor((b - f + 1) / 3);
  const h = (19 * a + b - d - g + 15) % 30, i = Math.floor(c / 4), k = c % 4, l = (32 + 2 * e + 2 * i - h - k) % 7, m = Math.floor((a + 11 * h + 22 * l) / 451);
  return new Date(y, Math.floor((h + l - 7 * m + 114) / 31) - 1, ((h + l - 7 * m + 114) % 31) + 1);
}
function festivi(y) {
  const p = pasqua(y);
  const l = [[0, 1, 'Capodanno'], [0, 6, 'Epifania'], [3, 25, 'Liberazione'], [4, 1, 'Primo maggio'], [5, 2, 'Festa della Repubblica'], [5, 29, 'Santi Pietro e Paolo, patroni di Roma'],
    [7, 15, 'Ferragosto'], [10, 1, 'Ognissanti'], [11, 8, 'Immacolata'], [11, 25, 'Natale'], [11, 26, 'Santo Stefano']].map(([m, g, n]) => ({ d: new Date(y, m, g), n }));
  if (y >= 2026) l.push({ d: new Date(y, 9, 4), n: 'San Francesco' });         // festa nazionale dal 2026
  l.push({ d: new Date(y, p.getMonth(), p.getDate() + 1), n: 'Lunedì dell\'Angelo' });
  return l.sort((a, b) => a.d - b.d);
}
function testoFestivi(y) {
  const l = festivi(y), g = d => d.toLocaleDateString('it-IT', { weekday: 'short', day: 'numeric', month: 'short' }).replace(/\./g, '');
  const chiave = d => isoGiorno(d), fest = new Set(l.map(x => chiave(x.d)));
  const settimana = l.filter(x => x.d.getDay() >= 1 && x.d.getDay() <= 5), weekend = l.filter(x => x.d.getDay() === 0 || x.d.getDay() === 6);
  const ponti = [];
  for (const x of l) {
    const wd = x.d.getDay(), salto = wd === 2 ? -1 : wd === 4 ? 1 : 0;
    if (!salto) continue;
    const p = new Date(x.d.getFullYear(), x.d.getMonth(), x.d.getDate() + salto);
    if (p.getFullYear() === y && !fest.has(chiave(p)) && !ponti.some(q => chiave(q.d) === chiave(p))) ponti.push({ d: p, n: x.n.split(',')[0] });
  }
  const lunghi = settimana.filter(x => x.d.getDay() === 1 || x.d.getDay() === 5);
  const elenco = a => a.map(x => `<span><b>${esc(g(x.d))}</b> ${esc(x.n)}</span>`).join(', ');
  return `<h2>Festivi ${y} a Roma</h2>
    <p><span class="et">Chiusure sicure</span> ${elenco(settimana)}.</p>
    ${weekend.length ? `<p><span class="et">Cadono nel fine settimana</span> ${elenco(weekend)}.</p>` : ''}
    <p><span class="et">Ponti probabili</span> ${ponti.length ? ponti.sort((a, b) => a.d - b.d).map(x => `<span><b>${esc(g(x.d))}</b> con ${esc(x.n)}</span>`).join(', ') + '.' : 'nessuno quest\'anno.'}</p>
    ${lunghi.length ? `<p><span class="et">Fine settimana lunghi senza ferie</span> ${lunghi.map(x => `<span>${esc(g(x.d))}</span>`).join(', ')}.</p>` : ''}
    <p class="nota">Pasqua è domenica ${pasqua(y).toLocaleDateString('it-IT', { day: 'numeric', month: 'long' })}. I ponti dipendono dall'azienda: qui trovi i giorni che di solito diventano ponte.</p>`;
}
function vFerie() {
  const ora = new Date(), anno = annoFerie, meseOra = anno === ora.getFullYear() ? ora.getMonth() : -1;
  return `<header class="vh"><div class="vh-t"><h1>Ferie</h1><div class="msw" role="group" aria-label="Anno">
      <button data-act="ferie-anno" data-n="-1" aria-label="Anno precedente">&lsaquo;</button><span class="per">${anno}</span><button data-act="ferie-anno" data-n="1" aria-label="Anno successivo">&rsaquo;</button>
      ${anno === ora.getFullYear() ? '' : '<button data-act="ferie-anno" data-n="0">Anno corrente</button>'}</div></div></header>${avvisoMemoria()}
  <div class="tw tsc"><table class="ft">
    <thead><tr><th scope="col">${anno}</th><th scope="col">Disponibili</th>${MESI_SIGLE.map((m, i) => `<th scope="col"${i === meseOra ? ' class="ora"' : ''}>${m}</th>`).join('')}<th scope="col">Rimasti</th></tr></thead>
    <tbody>${FERIE_RIGHE.map(([k, nome, unita]) => { const r = rigaFerie(anno, k); return `<tr data-k="${k}">
      <th scope="row">${nome}<small>${unita}</small></th>
      <td><input class="fd" data-fd inputmode="decimal" autocomplete="off" aria-label="${nome}: ${unita} disponibili nel ${anno}" value="${r.d == null ? '' : NFF.format(r.d)}"></td>
      ${MESI_SIGLE.map((m, i) => `<td${i === meseOra ? ' class="ora"' : ''}><input data-fm="${i}" inputmode="decimal" autocomplete="off" aria-label="${nome}, ${m} ${anno}" value="${numFerie(r.m[i])}"></td>`).join('')}
      <td class="rim" data-rim></td></tr>`; }).join('')}</tbody>
  </table></div>
  <p class="aiuto">In <strong>Disponibili</strong> scrivi quanto hai per l'anno; ogni numero che metti in un mese viene tolto da lì. B.O. è in ore, le altre righe in giorni; i mezzi valori si scrivono con la virgola (0,5).</p>
  <section class="festivi">${testoFestivi(anno)}</section>`;
}
function aggiornaFerie() {
  for (const [k, , unita] of FERIE_RIGHE) {
    const tr = main.querySelector(`.ft tr[data-k="${k}"]`); if (!tr) return;
    const r = rigaFerie(annoFerie, k), usati = r.m.reduce((a, v) => a + (v || 0), 0), cella = tr.querySelector('[data-rim]');
    if (r.d == null) { cella.textContent = usati ? `${NFF.format(usati)} usat${unita === 'ore' ? 'e' : 'i'}` : ''; cella.className = 'rim solo'; }
    else { const resto = Math.round((r.d - usati) * 100) / 100; cella.textContent = meno(NFF.format(resto)); cella.className = 'rim' + (resto < 0 ? ' neg' : ''); cella.title = `${NFF.format(usati)} ${unita} usat${unita === 'ore' ? 'e' : 'i'} su ${NFF.format(r.d)}`; }
  }
}
Object.assign(azioni, { 'ferie-anno': b => { const n = Number(b.dataset.n); annoFerie = n ? Math.min(2100, Math.max(2000, annoFerie + n)) : new Date().getFullYear(); disegna(); } });
document.addEventListener('input', e => {
  const t = e.target;
  if (!t.dataset || (t.dataset.fm === undefined && t.dataset.fd === undefined)) return;
  const k = t.closest('tr').dataset.k, raw = t.value.trim(), v = raw === '' ? (t.dataset.fd !== undefined ? null : 0) : leggiDec(raw);
  if (raw !== '' && (v == null || v > 9999)) { t.setAttribute('aria-invalid', 'true'); t.title = 'Scrivi un numero, ad esempio 5 oppure 0,5'; return; }
  t.removeAttribute('aria-invalid'); t.removeAttribute('title');
  const r = rigaFerieScrivi(annoFerie, k);
  if (t.dataset.fd !== undefined) r.d = v; else r.m[Number(t.dataset.fm)] = v;
  salvaPresto(); aggiornaFerie();
});
document.addEventListener('focusin', e => { const t = e.target; if (t.dataset && (t.dataset.fm !== undefined || t.dataset.fd !== undefined)) t.select(); });
document.addEventListener('keydown', e => {

  const campi = [...main.querySelectorAll('.ft input')], prox = campi[campi.indexOf(t) + 1];

/* ---------- Scheda Dati: cifrata, si apre con il PIN ----------
   Il PIN non viene mai salvato. Da PIN + sale casuale, Argon2id (128 MB di memoria, 4 passate: circa un secondo
   per tentativo) ricava la chiave; con quella chiave AES-256-GCM cifra la pagina. Sul disco e su Drive finisce solo
   il testo cifrato. La chiave resta in memoria finché la scheda è aperta e sparisce appena si esce. */
const KDF = { alg: 'argon2id', m: 131072, t: 4, p: 1 };
const PK = 'quaderno-morbido.pin', INATTIVA = 5 * 60000;
const utf8 = new TextEncoder(), AAD = utf8.encode('quaderno-morbido/dati/1');
let cf = null, cfT = 0, cfFermo = 0, cfLavoro = Promise.resolve(), tPin = 0;
const b64 = u => { let s = ''; for (let i = 0; i < u.length; i += 0x8000) s += String.fromCharCode.apply(null, u.subarray(i, i + 0x8000)); return btoa(s); };
const b64dec = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
const cifraturaOk = () => !!(window.crypto && crypto.subtle && window.hashwasm && hashwasm.argon2id);

async function derivaChiave(pin, kdf) {
  const raw = await hashwasm.argon2id({ password: pin, salt: b64dec(kdf.salt), parallelism: kdf.p, iterations: kdf.t, memorySize: kdf.m, hashLength: 32, outputType: 'binary' });
  const k = await crypto.subtle.importKey('raw', raw, 'AES-GCM', false, ['encrypt', 'decrypt']);
  raw.fill(0);
  return k;
}
async function cifraVoci(c) {
  const iv = crypto.getRandomValues(new Uint8Array(12));
  const ct = await crypto.subtle.encrypt({ name: 'AES-GCM', iv, additionalData: AAD }, c.chiave, utf8.encode(JSON.stringify({ doc: c.doc })));
  return { v: 1, kdf: c.kdf, iv: b64(iv), ct: b64(new Uint8Array(ct)) };
}
function cfSalva() {                                         // ricifra e salva; resta in coda dietro al salvataggio precedente
  clearTimeout(cfT);
  if (!cf) return cfLavoro;
  const mio = cf;
  cfLavoro = cfLavoro.then(async () => {
    if (cf !== mio) return;
    const blob = await cifraVoci(mio);
    if (cf === mio) { db.cassaforte = blob; salva(); }
  }).catch(() => {});
  return cfLavoro;
}
function cfTocco() {
  clearTimeout(cfFermo);
  cfFermo = setTimeout(async () => {
    if (!cf) return;
    await cfSalva(); cassaforteBlocca();
    if (rotta().vista === 'dati') { disegna(); avviso('Scheda richiusa dopo 5 minuti di inattività'); }
  }, INATTIVA);
}
function cfSalvaPresto() { clearTimeout(cfT); cfT = setTimeout(cfSalva, 400); cfTocco(); }
function cassaforteBlocca() { clearTimeout(cfT); clearTimeout(cfFermo); clearTimeout(tPin); cf = null; }
async function cassaforteEsci() { if (cf && rotta().vista !== 'dati') { await cfSalva(); cassaforteBlocca(); } }

/* tentativi sbagliati: dopo il quinto si aspetta, ogni volta il doppio (è un freno in più, la protezione vera è Argon2id) */
const pinStato = () => Object.assign({ n: 0, fino: 0 }, leggiLocale(PK, {}));
const pinScrivi = s => { try { localStorage.setItem(PK, JSON.stringify(s)); } catch (e) {} };
function pinSbagliato() { const s = pinStato(); s.n++; if (s.n >= 5) s.fino = Date.now() + Math.min(15 * 60000, 30000 * Math.pow(2, s.n - 5)); pinScrivi(s); return s; }
const pinFacile = p => /^(\d)\1{5}$/.test(p) || '0123456789012345'.includes(p) || '9876543210987654'.includes(p);
const LUCCHETTO = '<svg class="luc" viewBox="0 0 24 24" width="34" height="34" aria-hidden="true"><rect x="4.5" y="10.5" width="15" height="10" rx="3" fill="none" stroke="currentColor" stroke-width="1.7"/><path d="M8 10.5V8a4 4 0 0 1 8 0v2.5" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/><circle cx="12" cy="15.5" r="1.4" fill="currentColor"/></svg>';
const campoPin = (id, etichetta) => `<label class="pinl" for="${id}">${etichetta}</label><input class="pin" id="${id}" inputmode="numeric" maxlength="6" autocomplete="off" spellcheck="false" placeholder="••••••" aria-describedby="pinMsg">`;

function vCassaforte() {
  const testa = (sotto, bottoni) => `<header class="vh"><div><h1>Dati</h1><p class="sub">${sotto}</p></div>${bottoni || ''}</header>${avvisoMemoria()}`;
  if (!cifraturaOk()) return testa('Scheda cifrata.') + '<div class="vuoto"><p>Questo browser non mette a disposizione la cifratura che serve a questa scheda. Aprila da un browser aggiornato e da un indirizzo https.</p></div>';
  if (cf && cf.cambio) return testa('Scegli il nuovo PIN.') + `<form class="pinbox" id="pinNuovo" autocomplete="off">${LUCCHETTO}
      ${campoPin('pin1', 'Nuovo PIN di 6 cifre')}${campoPin('pin2', 'Ripetilo')}
      <p class="pinmsg" id="pinMsg" aria-live="polite"></p>
      <div class="btns"><button type="button" class="btn quiet" data-act="cf-cambia-no">Annulla</button><button class="btn primary">Cambia PIN</button></div></form>`;
  if (cf) return testa('Aperta: scrivi liberamente. Si richiude quando esci dalla pagina, o dopo 5 minuti senza toccarla.',
      '<div class="btns"><button class="btn" data-act="cf-cambia">Cambia PIN</button><button class="btn" data-act="cf-blocca">Chiudi a chiave</button></div>')
    + `<div class="np-tools" role="group" aria-label="Testo"><div class="tg"><span class="tl">Testo</span>${barraTesto()}</div><span class="muted pic">Si salva da sola, cifrata</span></div>
      <article class="foglio fc"><div class="nx rt" id="cfx" contenteditable="true" role="textbox" aria-multiline="true" aria-label="Pagina cifrata" spellcheck="false" data-ph="Scrivi qui quello che vuoi tenere al sicuro. Un trattino e uno spazio a inizio riga fanno partire un elenco.">${cf.doc}</div></article>`;
  if (!db.cassaforte) return testa('Scheda cifrata: quello che scrivi qui si legge solo con il PIN.') + `<form class="pinbox" id="pinCrea" autocomplete="off">${LUCCHETTO}
      ${campoPin('pin1', 'Scegli un PIN di 6 cifre')}${campoPin('pin2', 'Ripetilo')}
      <p class="pinmsg" id="pinMsg" aria-live="polite"></p>
      <button class="btn primary">Crea la scheda cifrata</button>
      <p class="pinnota">Il PIN non è salvato da nessuna parte e non si può recuperare: se lo dimentichi, il contenuto di questa scheda è perso.</p></form>`;
  return testa('Scheda cifrata: si apre con il PIN.') + `<form class="pinbox" id="pinApri" autocomplete="off">${LUCCHETTO}
      ${campoPin('pin', 'Scrivi il PIN di 6 cifre')}
      <p class="pinmsg" id="pinMsg" aria-live="polite"></p>
      <button type="button" class="link" data-act="cf-dimenticato">Ho dimenticato il PIN</button></form>`;
}
function attesaPin() {                                       // se ci sono stati troppi errori, blocca il campo fino allo scadere
  const el = $('#pin'), m = $('#pinMsg'); if (!el) return false;
  const resto = pinStato().fino - Date.now();
  clearTimeout(tPin);
  if (resto <= 0) { if (el.disabled) { el.disabled = false; m.textContent = ''; el.focus(); } return false; }
  el.disabled = true; el.value = '';
  m.textContent = `Troppi tentativi sbagliati. Riprova tra ${resto > 90000 ? Math.ceil(resto / 60000) + ' minuti' : Math.ceil(resto / 1000) + ' secondi'}.`;
  tPin = setTimeout(attesaPin, 1000);
  return true;
}
function dopoCassaforte() {
  if (cf && !cf.cambio) { rtVuoto($('#cfx')); cfTocco(); return; }
  if ($('#pin') && attesaPin()) return;
  const primo = $('#pin') || $('#pin1'); if (primo) primo.focus();
}
async function sblocca(pin) {
  if (attesaPin()) return;
  const el = $('#pin'), m = $('#pinMsg'), dati = db.cassaforte;
  el.disabled = true; m.textContent = 'Apro la scheda…';
  let chiave;
  try { chiave = await derivaChiave(pin, dati.kdf); }
  catch (e) { el.disabled = false; el.value = ''; m.textContent = 'Questo dispositivo non riesce a calcolare la chiave (serve più memoria libera).'; return; }
  try {
    const chiaro = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: b64dec(dati.iv), additionalData: AAD }, chiave, b64dec(dati.ct));
    const j = JSON.parse(new TextDecoder().decode(chiaro));
    const doc = typeof j.doc === 'string' ? pulisciHtml(j.doc)                 // la prima versione teneva un elenco di voci: diventano un testo unico
      : (Array.isArray(j.voci) ? j.voci : []).filter(v => v && typeof v === 'object').map(v => `<div><b>${esc(String(v.titolo || '').slice(0, 120))}</b></div>${htmlDaTesto(String(v.testo || '').slice(0, 20000))}`).join('<div><br></div>');
    pinScrivi({ n: 0, fino: 0 });
    if (db.cassaforte !== dati || rotta().vista !== 'dati') return;      // nel frattempo si è usciti o i dati sono cambiati
    cf = { chiave, kdf: dati.kdf, doc };
    disegna();
  } catch (e) {
    const s = pinSbagliato();
    if (!$('#pin')) return;
    el.disabled = false; el.value = '';
    if (!attesaPin()) { m.textContent = 'PIN sbagliato.' + (s.n >= 3 ? ` Ancora ${5 - s.n === 1 ? 'un tentativo' : 5 - s.n + ' tentativi'} prima di una pausa.` : ''); el.focus(); }
  }
}
async function pinDaModulo(f) {
  const a = $('#pin1').value, b = $('#pin2').value, m = $('#pinMsg');
  if (!/^\d{6}$/.test(a)) { m.textContent = 'Il PIN deve avere 6 cifre.'; $('#pin1').focus(); return; }
  if (a !== b) { m.textContent = 'I due PIN non coincidono.'; $('#pin2').value = ''; $('#pin2').focus(); return; }
  if (pinFacile(a)) { m.textContent = 'Questo PIN è tra i primi che chiunque proverebbe: scegline un altro.'; return; }
  f.querySelectorAll('input,button').forEach(x => { x.disabled = true; });
  m.textContent = 'Preparo la chiave…';
  try {
    const kdf = Object.assign({}, KDF, { salt: b64(crypto.getRandomValues(new Uint8Array(16))) }), chiave = await derivaChiave(a, kdf);
    cf = { chiave, kdf, doc: cf ? cf.doc : '' };
    await cfSalva(); pinScrivi({ n: 0, fino: 0 });
    disegna(); avviso(f.id === 'pinCrea' ? 'Scheda cifrata creata' : 'PIN cambiato');
  } catch (e) {
    f.querySelectorAll('input,button').forEach(x => { x.disabled = false; });
    m.textContent = 'Questo dispositivo non riesce a calcolare la chiave (serve più memoria libera).';
  }
}

Object.assign(azioni, {
  'cf-blocca': async () => { await cfSalva(); cassaforteBlocca(); disegna(); },
  'cf-cambia': () => { if (cf) { cf.cambio = true; disegna(); } },
  'cf-cambia-no': () => { if (cf) { delete cf.cambio; disegna(); } },
  'cf-dimenticato': async () => {
    if (!await chiedi('Azzerare la scheda cifrata?', 'Senza PIN il contenuto non si può leggere né recuperare. Posso solo cancellare tutto quello che c\'è nella scheda e fartene creare una nuova, vuota, con un altro PIN.', 'Cancella il contenuto', true)) return;
    cassaforteBlocca(); db.cassaforte = null; pinScrivi({ n: 0, fino: 0 }); salva(); disegna();
  }
});
document.addEventListener('input', e => {
  const t = e.target;
  if (t.classList && t.classList.contains('pin')) {
    t.value = t.value.replace(/\D/g, '').slice(0, 6);
    if (t.id === 'pin' && t.value.length === 6) sblocca(t.value);
    else if (t.id === 'pin1' && t.value.length === 6) $('#pin2').focus();
  } else if (t.id === 'cfx' && cf) {
    cf.doc = pulisciHtml(t.innerHTML); rtVuoto(t);
    cfSalvaPresto();
  }
});
document.addEventListener('focusout', e => { if (cf && e.target.id === 'cfx') cfSalva(); });
document.addEventListener('submit', e => {
  const f = e.target;
  if (f.id === 'pinCrea' || f.id === 'pinNuovo') { e.preventDefault(); pinDaModulo(f); }
  else if (f.id === 'pinApri') e.preventDefault();
});
document.addEventListener('pointerdown', () => { if (cf) cfTocco(); });
window.addEventListener('pagehide', () => { if (cf) cfSalva(); });

/* ---------- Allegati PDF: i file stanno nella cartella "allegati" su Drive, nei dati resta solo il collegamento ---------- */
const dlg = $('#dlg'), MAX_PDF = 30 * 1024 * 1024;
let allRef = '', allOccupato = false;
const etichettaAllegati = l => 'Allegati' + ((l || []).length ? ` (${l.length})` : '');
function bersaglio(ref) {
  const [t, a, b] = String(ref).split(':');
  if (t === 'n') return db.note.find(n => n.id === a);
}
function disegnaAllegati(msg) {
  const o = bersaglio(allRef);
  if (!o) { if (dlg.open) dlg.close(); return; }
  const l = o.allegati || (o.allegati = []), attivo = driveAttivo();

    ${attivo ? '' : '<p>I PDF vengono salvati in una cartella di Google Drive: prima collega Drive dalle <a href="#impostazioni" data-act="chiudi-dlg">Impostazioni</a>.</p>'}
    ${l.length ? `<ul class="al">${l.map(a => `<li><a href="https://drive.google.com/file/d/${esc(a.id)}/view" target="_blank" rel="noopener">${esc(a.nome)}</a><button class="x" data-act="all-via" data-id="${esc(a.id)}" aria-label="Togli ${esc(a.nome)}">&times;</button></li>`).join('')}</ul>` : (attivo ? '<p class="muted">Nessun PDF allegato a questa nota.</p>' : '')}
    <p class="muted" id="allMsg" aria-live="polite">${esc(msg || '')}</p>
    <div class="form-foot"><button class="btn quiet" data-act="chiudi-dlg">Chiudi</button>${attivo ? `<button class="btn primary" data-act="all-aggiungi"${allOccupato ? ' disabled' : ''}>Aggiungi PDF</button>` : ''}</div></div>`;
}
async function caricaPdf(file) {
  if (!dr.allegati) await struttura();
  const m = multiparte({ name: file.name, parents: [dr.allegati], mimeType: 'application/pdf' }, file, 'application/pdf');
  const j = await gj(`${UP}/files?uploadType=multipart&fields=id,name`, { method: 'POST', headers: { 'Content-Type': m.tipo }, body: m.blob });
  return { id: j.id, nome: String(j.name || file.name).slice(0, 200) };
}
async function aggiungiPdf(files) {
  const o = bersaglio(allRef); if (!o || allOccupato) return;
  allOccupato = true;
  let fatti = 0, msg = '';
  for (const f of files) {
    if (f.type !== 'application/pdf' && !/\.pdf$/i.test(f.name)) { msg = `${f.name} non è un PDF.`; continue; }
    if (f.size > MAX_PDF) { msg = `${f.name} supera i 30 MB.`; continue; }
    disegnaAllegati(`Carico ${f.name}…`);
    try { (o.allegati || (o.allegati = [])).push(await caricaPdf(f)); fatti++; salva(); }
    catch (e) {
      msg = e.scaduto ? 'Drive va ricollegato: clicca sullo stato in alto e riprova.' : e.rete ? 'Manca la rete: riprova tra poco.' : `Non sono riuscito a caricare ${f.name}: ${e.message}`;
      if (e.scaduto) stato('scaduto');
      break;
    }
  }
  allOccupato = false;
  if (fatti) disegna();
  disegnaAllegati(msg || (fatti ? (fatti === 1 ? 'PDF allegato.' : fatti + ' PDF allegati.') : ''));
}

Object.assign(azioni, {
  allegati: b => { allRef = b.dataset.ref; if (!bersaglio(allRef)) return; disegnaAllegati(); dlg.showModal(); },
  'chiudi-dlg': () => dlg.close(),
  'all-aggiungi': () => $('#pdf').click(),
  'all-via': async b => {
    const o = bersaglio(allRef); if (!o) return;
    const i = o.allegati.findIndex(a => a.id === b.dataset.id); if (i < 0) return;
    const [tolto] = o.allegati.splice(i, 1);
    salva(); disegna(); disegnaAllegati('Allegato tolto.');
    if (driveAttivo()) { try { await g(`${API}/files/${tolto.id}`, invia('PATCH', { trashed: true })); disegnaAllegati('Allegato tolto: il PDF è nel cestino di Drive.'); } catch (e) {} }
  },

  /* appunti sparsi: ogni file di testo diventa una nota */
  'importa-note': () => $('#impNote').click()
});
function leggiTesto(file) { return new Promise((ok, no) => { const r = new FileReader(); r.onload = () => ok(String(r.result)); r.onerror = no; r.readAsText(file); }); }
async function importaNote(files) {
  let fatte = 0, saltate = 0;
  for (const f of files) {
    if (!/\.(txt|md|markdown|text)$/i.test(f.name) && !/^text\//.test(f.type)) { saltate++; continue; }
    if (f.size > 2 * 1024 * 1024) { saltate++; continue; }
    let testo;
    try { testo = (await leggiTesto(f)).replace(/\r\n?/g, '\n').replace(/^﻿/, ''); } catch (e) { saltate++; continue; }
    let titolo = f.name.replace(/\.[^.]+$/, '');
    const m = testo.match(/^\s*#\s+(.+)\n?/);                 // un titolo Markdown in cima diventa il titolo della nota
    if (m) { titolo = m[1].trim(); testo = testo.slice(m[0].length); }
    db.note.push({ id: uid(), titolo: titolo.slice(0, 120), testo: htmlDaTesto(testo.trim().slice(0, 200000), true), ricco: true, font: 'semplice', dim: 'medio', carta: GIRO[db.note.length % GIRO.length], inch: 'nero', aggiornata: Date.now() + fatte, allegati: [] });
    fatte++;
  }
  if (fatte) { salva(); disegna(); }
  avviso((fatte ? (fatte === 1 ? 'Una nota importata' : fatte + ' note importate') : 'Nessuna nota importata') + (saltate ? ` (${saltate === 1 ? 'un file saltato' : saltate + ' file saltati'}: servono file di testo fino a 2 MB)` : ''));
}
document.addEventListener('change', e => {
  const t = e.target;
  if (t.id === 'pdf') { const l = [...t.files]; t.value = ''; if (l.length) aggiungiPdf(l); }
  else if (t.id === 'impNote') { const l = [...t.files]; t.value = ''; if (l.length) importaNote(l); }
});

/* ---------- Impostazioni ---------- */
const nomePeriodo = p => { const [y, m] = p.split('-').map(Number); const s = new Date(y, m - 1, 1).toLocaleDateString('it-IT', { month: 'long', year: 'numeric' }); return s.charAt(0).toUpperCase() + s.slice(1); };
function guidaDrive() {
  return `<details class="guida"${clientId() ? '' : ' open'}><summary>Come si prepara l'accesso a Google (una volta sola)</summary>
    <ol>
      <li>Apri <a href="https://console.cloud.google.com/" target="_blank" rel="noopener">console.cloud.google.com</a> con il tuo account e crea un progetto, ad esempio "Quaderno".</li>
      <li>In <em>API e servizi → Libreria</em> abilita <strong>Google Drive API</strong> e <strong>Google Sheets API</strong> (la seconda serve ai prezzi degli investimenti).</li>
      <li>Configura la schermata di consenso OAuth: tipo di utenti <em>Esterno</em>, un nome per l'app e la tua email. Come stato di pubblicazione scegli <em>In produzione</em>: con <em>Test</em> Google ti richiede l'autorizzazione ogni 7 giorni.</li>
      <li>Crea le credenziali: <em>ID client OAuth → Applicazione web</em>. In <em>Origini JavaScript autorizzate</em> aggiungi esattamente <code>${esc(sulWeb() ? location.origin : "l'indirizzo da cui apri il quaderno")}</code></li>
      <li>Copia l'ID client (finisce con <code>.apps.googleusercontent.com</code>) e incollalo qui sotto. Per non doverlo reinserire su ogni computer, scrivilo anche nella riga <code>QUADERNO_CLIENT_ID</code> in cima al file prima di pubblicarlo.</li>
    </ol>
    <p class="muted">Alla prima autorizzazione Google può mostrare l'avviso "app non verificata": è normale per un'app personale, si prosegue da <em>Avanzate</em>. Il quaderno chiede solo il permesso di gestire i file che crea lui: non vede il resto del tuo Drive.</p>
  </details>`;
}
function disegnaDrive() {
  const box = $('#drBox'); if (!box) return;
  const scarto = leggiLocale(SCARTO, null);
  let h;
  if (!sulWeb()) h = `<p>Per sincronizzare con Google Drive il quaderno va aperto da un indirizzo web (https), non con doppio clic sul file: Google non autorizza l'accesso da un file locale. Così com'è ora, salva solo in questo browser.</p>${guidaDrive()}`;
  else if (!clientId()) h = `<p>Manca l'ID client di Google: serve a far riconoscere il quaderno al tuo account.</p>${guidaDrive()}
    <form class="riga" id="fCid"><input id="cid" autocomplete="off" spellcheck="false" aria-label="ID client OAuth" placeholder="1234567890-abc.apps.googleusercontent.com"><button class="btn primary">Salva l'ID client</button></form>`;
  else if (!dr.collegato) h = `<p>I dati sono solo in questo browser. Collegando Drive vengono salvati nella cartella "${CARTELLA}" del tuo Drive e li ritrovi da qualsiasi computer.</p>
    <p class="btns"><button class="btn primary" data-act="drive-collega">Collega Google Drive</button>${window.QUADERNO_CLIENT_ID ? '' : '<button class="btn quiet" data-act="cid-cambia">Cambia ID client</button>'}</p>${guidaDrive()}`;
  else {
    const [t] = testoStato();
    h = `<p>Collegato${dr.email ? ' come <strong>' + esc(dr.email) + '</strong>' : ''}. ${esc(t)}.</p>
    <p class="btns">${drStato === 'scaduto' ? '<button class="btn primary" data-act="drive-collega">Ricollega</button>' : '<button class="btn" data-act="drive-ora">Sincronizza adesso</button>'}${dr.cartella ? `<a class="btn" href="https://drive.google.com/drive/folders/${esc(dr.cartella)}" target="_blank" rel="noopener">Apri la cartella su Drive</a>` : ''}<button class="btn quiet" data-act="drive-scollega">Scollega</button></p>
    <p class="muted">Google concede l'accesso per un'ora alla volta. Il rinnovo passa da una finestrella che si apre e si chiude da sola: perché funzioni senza clic, consenti i popup per questo sito. Se il browser la blocca, lo stato in alto ti chiede di ricollegare.</p>`;
  }
  if (scarto && scarto.dati) h += `<p class="muted">Il ${new Date(scarto.quando).toLocaleDateString('it-IT', { day: 'numeric', month: 'long' })} hai scelto la versione di Drive al posto di quella di questo dispositivo. Quella scartata è ancora qui: <button class="link" data-act="scarto-scarica">scaricala</button> o <button class="link" data-act="scarto-via">buttala</button>.</p>`;
  box.innerHTML = h;
  const bb = $('#bkBox'); if (!bb) return;
  if (!driveAttivo()) bb.innerHTML = '<p class="muted">I backup automatici partono quando Drive è collegato.</p>';
  else if (!backupDrive) bb.innerHTML = '<p class="muted">Leggo l\'elenco…</p>';
  else if (!backupDrive.length) bb.innerHTML = '<p class="muted">Ancora nessun backup: il primo viene creato il 15.</p>';
  else bb.innerHTML = `<ul class="al">${backupDrive.map(f => `<li><span><strong>${esc(nomePeriodo(f.appProperties.periodo))}</strong> <span class="muted">creato il ${new Date(f.createdTime).toLocaleDateString('it-IT', { day: 'numeric', month: 'long', year: 'numeric' })}</span></span><button class="btn sm" data-act="backup-ripristina" data-id="${esc(f.id)}">Ripristina</button></li>`).join('')}</ul>`;
}
function vImpostazioni() {
  const temi = { auto: ['Come il sistema', ''], light: ['Chiaro', '#ecf1ea'], dark: ['Bosco', '#1b2420'], blu: ['Blu notte', '#101a31'], carbone: ['Carbone', '#1b1b1c'] };
  return `<header class="vh"><h1>Impostazioni</h1></header>${avvisoMemoria()}
  <section class="blk"><h2>Google Drive</h2><div id="drBox"></div></section>
  <section class="blk"><h2>Backup automatici</h2>
    <p>Ogni mese, la prima volta che apri il quaderno dal giorno 15 in poi, una copia dei dati finisce nella cartella "backup" su Drive. Restano le tre più recenti; la più vecchia va nel cestino di Drive.</p>
    <div id="bkBox"></div>
  </section>
  <section class="blk"><h2>Copia su file</h2>
    <p>Una copia dei dati in un file sul computer, da tenere dove vuoi. La scheda Dati resta cifrata anche lì. Ultima esportazione: <strong>${etaBackup()}</strong>.</p>
    <p class="btns"><button class="btn" data-act="esporta">Esporta una copia</button><button class="btn" data-act="importa">Ripristina da una copia</button></p>
  </section>
  <section class="blk"><h2>Aspetto</h2>
    <p>Un tema chiaro e tre scuri: Bosco è il verde di prima, Blu notte e Carbone sono i due nuovi.</p>
    <div class="temi" role="group" aria-label="Tema">${Object.keys(temi).map(v => `<button data-act="tema" data-v="${v}" aria-pressed="${db.tema === v}">${temi[v][1] ? `<i style="background:${temi[v][1]}"></i>` : '<i class="meta"></i>'}${temi[v][0]}</button>`).join('')}</div>
  </section>
  <section class="blk"><h2>Svuota il quaderno</h2>
    <p>Azzera prospetto, conti al volo, ReesparmioFoil e ferie ed elimina le note e la pagina cifrata.</p>
    <p class="btns"><button class="btn del" data-act="svuota">Svuota il quaderno</button></p>
  </section>`;
}
function dopoImpostazioni() {
  disegnaDrive();
  if (driveAttivo() && drStato !== 'scaduto') lavoro(async () => { if (!dr.backup) await struttura(); backupDrive = (await elencoBackup()).slice(0, 3); }, '').then(() => disegnaDrive());
}

Object.assign(azioni, {
  stato: () => { if (driveAttivo() && drStato === 'scaduto') driveCollega(); else if (driveAttivo() && (drStato === 'offline' || drStato === 'errore')) lavoro(sincronizza, 'salvando'); else location.hash = '#impostazioni'; },
  'drive-collega': () => driveCollega(),
  'drive-ora': () => lavoro(sincronizza, 'salvando').then(ok => { if (ok) avviso('Sincronizzato con Drive'); }),
  'drive-scollega': async () => {
    if (!await chiedi('Scollegare Google Drive?', 'I dati restano su Drive e in questo browser, ma da qui non verranno più sincronizzati finché non ricolleghi.', 'Scollega', false)) return;
    clearTimeout(tDrive);
    try { if (dr.token && window.google) google.accounts.oauth2.revoke(dr.token, () => {}); } catch (e) {}
    dr = Object.assign({}, DR0); salvaDr(); backupDrive = null; stato('ok'); disegna();
  },
  'cid-cambia': () => { try { localStorage.removeItem(CK); } catch (e) {} disegna(); },
  'backup-ripristina': async b => {
    const f = (backupDrive || []).find(x => x.id === b.dataset.id); if (!f) return;
    if (!await chiedi('Ripristinare questo backup?', `I dati di adesso vengono sostituiti con quelli del backup di ${nomePeriodo(f.appProperties.periodo).toLowerCase()}, su questo dispositivo e su Drive.`, 'Ripristina', true)) return;
    const ok = await lavoro(async () => {
      const j = await gj(`${API}/files/${f.id}?alt=media`);
      if (!j || j.app !== 'quaderno-morbido') throw new Error('il backup non è leggibile');
      const tema = db.tema; cassaforteBlocca(); db = normalizza(j); db.tema = tema; pulisciMesi(); salva(); applicaTema(); disegna();
    }, 'salvando');
    if (ok) avviso('Backup ripristinato');
  },
  'scarto-scarica': () => { const s = leggiLocale(SCARTO, null); if (s && s.dati) scarica(`quaderno-morbido-scartato-${isoGiorno(new Date(s.quando))}.json`, JSON.stringify(s.dati, null, 2), 'application/json'); },
  'scarto-via': () => { try { localStorage.removeItem(SCARTO); } catch (e) {} disegnaDrive(); }
});
document.addEventListener('submit', e => {
  if (e.target.id !== 'fCid') return;
  e.preventDefault();
  const v = $('#cid').value.trim();
  if (!/^[\w.-]+\.apps\.googleusercontent\.com$/.test(v)) { avviso('Non sembra un ID client: finisce con .apps.googleusercontent.com'); return; }
  try { localStorage.setItem(CK, v); } catch (e2) {}
  disegna();
});

applicaTema();
disegna();
driveAvvio();

})();
</script>
